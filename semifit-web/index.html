<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>semifit — extractor de parámetros</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <h1>semifit</h1>

  <div class="controles">
    <label>Archivo CSV (V, I)
      <input type="file" id="archivo" accept=".csv,.txt">
    </label>
    <label><span>Columna V</span><select id="colV"></select></label>
    <label><span>Columna I</span><select id="colI"></select></label>
    <label><span>T [K]</span> <input type="number" id="temp" value="300" step="1"></label>
    <label><span>V<sub>min</sub> [V]</span> <input type="number" id="vmin" value="0.30" step="0.01"></label>
    <label><span>V<sub>max</sub> [V]</span> <input type="number" id="vmax" value="0.70" step="0.01"></label>
    <label><span><input type="checkbox" id="escalaLog" checked> Escala log</span></label>
  </div>

  <p id="estado"></p>
  <div id="grafica"></div>

  <div class="resultado">
    <div>
      <strong>Parámetros</strong>
      <pre id="params">—</pre>
    </div>
    <div>
      <strong>Tarjeta SPICE</strong>
      <pre id="tarjeta">—</pre>
      <button id="copiar">Copiar</button>
    </div>
  </div>
</body>
</html>
